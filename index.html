<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Budget App - Планирование бюджета</title>
    
    <!-- Базовые стили -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/common.css">
    
    <!-- Подключение Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Контейнер приложения - сюда будут загружаться модули -->
    <div id="app">
        <!-- Модули будут загружаться динамически -->
        <div class="app-loading">
            <div class="loader">
                <div class="loader-spinner"></div>
                <div class="loader-text">Загрузка приложения...</div>
            </div>
        </div>
    </div>

    <!-- Главный скрипт приложения -->
    <script type="module" src="app.js"></script>

    <!-- Тестовые данные (удалить в продакшене) -->
<script>
    // Проверяем, есть ли уже данные
    const hasData = localStorage.getItem('budgetOperations') || 
                    localStorage.getItem('budgetExpectedIncomes') || 
                    localStorage.getItem('budgetPlannedExpenses');
    
    if (!hasData) {
        // Загружаем тестовые данные
        const script = document.createElement('script');
        script.src = 'test-data.js';
        document.body.appendChild(script);
    }
</script>

</body>
</html>
