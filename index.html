<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header container">
        <div class="header__logo">budget</div>
        <div class="header__item header__income income">
            <div class="header__title">Доходы</div>
            <div class="income__sum header__sum sum">0,00 Р</div>
        </div>
        <div class="header__item header__expenses expenses">
            <div class="header__title">Расходы</div>
            <div class="expenses__sum header__sum sum">0,00 Р</div>
        </div>
    </header>
    <main class="main container">
        <div class="add">
            <div class="control-panel">
                <h2 class="control-panel__title">Добавить</h2>
                <div class="control-panel__categories categories">
                    <div class="categories__item active">Доходы</div>
                    <div class="categories__item">Расходы</div>
                    <div class="categories__item">Планы</div>
                </div>
            </div>
            <input type="text" class="add__input" placeholder="Сумма">
            <div class="add__hint">Введите сумму в рублях</div>
            <input type="text" class="add__input" placeholder="Описание">
            <div class="add__hint">Например: “Зарплата”, “Продукты”</div>
            <input type="date" id="birthday" name="birthday" class="add__input">
            <div class="add__hint">Выберите дату</div>
            <a href="#" class="add__btn">+ Добавить операцию<a> 
        </div>
        <div class="list">
            <div class="control-panel">
                <h2 class="control-panel__title">Плановые траты</h2>
            </div>
            <!-- <div class="list__no-history">Операций пока нет</div> -->
             <label class="custom-checkbox">
            <input type="checkbox" class="visually-hidden">
            <span class="checkbox-icon"></span>
            <p>дата</p>
            <p>Название</p>
            <p>Сумма</p>
            </label>
        </div>
        <div class="list history">
            <div class="control-panel">
                <h2 class="control-panel__title">Список операций</h2>
                <div class="control-panel__categories categories">
                    <div class="categories__item active">Все</div>
                    <div class="categories__item">Доходы</div>
                    <div class="categories__item">Расходы</div>
                </div>
            </div>
            <!-- <div class="list__no-history">Операций пока нет</div> -->
            <div class="operation">
                <p>Название</p>
                <p>Сумма</p>
            </div>
            
        </div>
    </main>
    
    <footer class="footer container">
        <div class="footer__btn">Очистить данные</div>
        <div class="footer__sign">Оптимизировано для мобильных</div>
    </footer>
</body>
</html>
