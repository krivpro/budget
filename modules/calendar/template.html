<!-- Модальное окно календаря -->
<div class="calendar-modal" id="calendarModal">
    <div class="calendar-content">
        <div class="calendar-header">
            <div class="calendar-title" id="calendarTitle">Январь 2024</div>
            <button class="calendar-close" id="calendarClose" aria-label="Закрыть календарь">×</button>
        </div>
        
        <div class="calendar-navigation">
            <button class="calendar-prev" id="calendarPrev" aria-label="Предыдущий месяц">‹</button>
            <button class="calendar-next" id="calendarNext" aria-label="Следующий месяц">›</button>
        </div>
        
        <div class="calendar-grid" id="calendarDays">
            <!-- Дни добавляются через JavaScript -->
        </div>
        
        <div class="calendar-actions">
            <button class="calendar-btn today" id="calendarToday">Сегодня</button>
            <button class="calendar-btn clear" id="calendarClear">Очистить</button>
            <button class="calendar-btn confirm" id="calendarConfirm">Готово</button>
        </div>
    </div>
</div>
